# Non-mutating safety checks only — nothing here rewrites files.
# detect-private-key backs the "no secrets in the repo" guarantee (README §Security).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
